name: Lint

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile quick_lightmap_baker/__init__.py
